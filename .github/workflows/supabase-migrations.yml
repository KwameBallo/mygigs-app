name: Supabase migraties toepassen

# Handmatige workflow. De automatische push-trigger is uitgezet: migraties worden
# in dit project handmatig in de Supabase SQL-editor gedraaid (de migratie-historie
# van de CLI is niet gesynchroniseerd, waardoor `db push` op bestaande objecten zou
# botsen). Wil je hem tóch draaien? Start 'm via Actions → "Run workflow".
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: obvvbeniswpertarxobj
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Koppelen aan project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Nieuwe migraties toepassen
        run: supabase db push
